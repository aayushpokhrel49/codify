[package]
license = "Apache-2.0"
name = "codify-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for xAI agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
codify-compaction-transcript = { workspace = true }
codify-compaction = { path = "../../common/codify-compaction" }
codify-sampling-types = { path = "../codify-sampling-types" }
codify-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
