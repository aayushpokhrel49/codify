[package]
license = "Apache-2.0"
name = "codify-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the grok CLI, extracted from codify-shell for dependency inversion."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
codify-config = { workspace = true }
codify-sandbox = { path = "../codify-sandbox", default-features = false }

[features]
default-bazel = []

[lints]
workspace = true
